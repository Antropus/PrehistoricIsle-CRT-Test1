name: Build Prehistoric Isle CRT Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile with Quartus 20.1
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            raetro/quartus:20.1 \
            quartus_sh --flow compile prehisle

      - name: Show generated files
        if: always()
        run: |
          echo "=== RBF files ==="
          find . -type f -iname "*.rbf" -print || true
          echo "=== Output files ==="
          find output_files -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Rename CRT test RBF
        run: |
          RBF=$(find . -type f -iname "prehisle.rbf" | head -1)
          if [ -z "$RBF" ]; then
            echo "ERROR: Quartus did not generate prehisle.rbf"
            exit 1
          fi

          cp "$RBF" prehisle_CRT_TEST_01.rbf

      - name: Upload CRT Test RBF
        uses: actions/upload-artifact@v4
        with:
          name: prehisle_CRT_TEST_01
          path: prehisle_CRT_TEST_01.rbf
          if-no-files-found: error
