name: Build Prehistoric Isle CRT Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: raetro/quartus:20.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile RBF with Quartus 20.1
        run: quartus_sh --flow compile prehisle.qpf

      - name: Stage test RBF
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          test -f output_files/prehisle.rbf
          cp output_files/prehisle.rbf artifact/prehisle_CRT_TEST_01.rbf
          sha256sum artifact/prehisle_CRT_TEST_01.rbf | tee artifact/SHA256.txt

      - name: Upload test RBF
        uses: actions/upload-artifact@v4
        with:
          name: prehisle_CRT_TEST_01
          path: artifact/
          if-no-files-found: error
